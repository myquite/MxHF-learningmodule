<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MxHF Active Learning Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
    <aside class="sidebar">
        <h2 class="sidebar-title">Learning Modules</h2>
        <div class="progress-container">
            <p class="progress-label">Progress:</p>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar">0%</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-button" id="prev-btn" disabled>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <button class="nav-button" id="next-btn">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
        <nav id="module-navigation">
            </nav>
        <div class="reset-container">
             <button id="reset-progress-btn" class="reset-button">
                 <i class="fas fa-undo"></i> Reset Progress
             </button>
        </div>
    </aside>

    <main class="main-content">
        <div id="module-display" class="module-content">
            <h1 class="welcome-title">Welcome!</h1>
            <p class="welcome-text">Select a module from the sidebar to begin your learning journey on Maintenance Human Factors.</p>
            <p class="welcome-text">This application uses interactive elements and scenarios to help you actively engage with the material and apply it to your work.</p>
        </div>
    </main>

    <div id="message-box" class="message-box">
        <p id="message-text"></p>
        <button onclick="closeMessageBox()">&times;</button>
                        </div>
                    </div>

    <script src="scripts.js"></script>
</body>
</html>
